name: Check family app source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check config.js
          node --check seed.js
          node --check toddler-seed.js
          node --check recommendations.js
      - name: Validate presets, month dates and cost calculations
        run: node tests/check-presets.cjs
